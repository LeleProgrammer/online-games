<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Binairo</title>
  <link rel="stylesheet" href="game.css?v=20260518_1">
  <link rel="icon" type="image/png" href="../../images/site-icon.png">
</head>
<body>
  <div class="container">
    <h1>⚫ Binairo</h1>
    <p class="subtitle">黑白</p>

    <div class="back-links">
      <a href="../../index.html" class="back-link">← 返回大厅</a>
      <a href="difficulty-select.html" class="back-link">← 返回难度选择</a>
    </div>

    <div class="game-info">
      <span>🎯 难度：<span id="difficulty"></span></span>
      <span>用时：<span id="timer"></span></span>
      <button id="newGameBtn">✨ 新游戏</button>
    </div>

    <!-- 游戏网格（带格子间提示） -->
    <div class="binairo-wrapper">
      <div class="binairo-grid" id="binairoGrid"></div>
    </div>

    <div class="action-bar">
      <button class="action-btn" data-action="black">⚫ 黑子</button>
      <button class="action-btn" data-action="white">⚪ 白子</button>
      <button class="action-btn clear-btn" data-action="clear">🗑️ 清除</button>
    </div>

    <div class="message" id="message"></div>

    <div class="instructions">
      <p>📖 游戏规则</p>
      <p>• 每行每列中 ⚫ 和 ⚪ 数量相等</p>
      <p>• 禁止三个相同颜色连续排列（水平或垂直）</p>
      <p>• <strong>＝</strong> 表示相邻两格必须相同，<strong>✗</strong> 表示必须不同</p>
      <p>• 单击 0 放置白字，1 放置黑子</p>
      <p>• 单击 Backspace 或 delete 清除</p>
    </div>
  </div>

  <script src="game.js?v=20260518_1"></script>
</body>
</html>
