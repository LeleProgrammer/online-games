<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>选择难度 | Binario</title>
  <link rel="stylesheet" href="difficulty.css?v=20260518_1">
  <link rel="icon" type="image/png" href="../../images/site-icon.png">
</head>
<body>
  <div class="container">
    <a href="../../index.html" class="back-link">← 返回大厅</a>

    <div class="game-icon">⚫</div>
    <h1>Binairo</h1>
    <p class="subtitle">选择你想要的难度</p>

    <div class="difficulty-options">
      <a href="game.html?diff=easy" class="difficulty-card easy">
        <div class="diff-icon">🌱</div>
        <div class="diff-info">
          <h3>简单 6x6</h3>
          <p>预填棋子较多 · 适合新手</p>
        </div>
        <div class="diff-stats">
          <span>约 13-15 个空格</span>
        </div>
      </a>

      <a href="game.html?diff=medium" class="difficulty-card medium">
        <div class="diff-icon">⚡</div>
        <div class="diff-info">
          <h3>中等 6x6</h3>
          <p>经典体验 · 平衡挑战</p>
        </div>
        <div class="diff-stats">
          <span>约 24-27 个空格</span>
        </div>
      </a>

      <a href="game.html?diff=hard" class="difficulty-card expert">
        <div class="diff-icon">🔥</div>
        <div class="diff-info">
          <h3>困难 6x6</h3>
          <p>需要推理技巧</p>
        </div>
        <div class="diff-stats">
          <span>约 31-33 个空格</span>
        </div>
      </a>

    </div>
  </div>

</body>
</html>
